[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherpipe"
version = "1.0.0"
description = "ELT pipeline: Open-Meteo API -> DuckDB -> dbt -> Streamlit climate dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "plotly>=5.24"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
weatherpipe = "weatherpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
