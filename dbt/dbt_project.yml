name: weather
version: "1.0.0"
config-version: 2
profile: weather

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # reference period for anomalies and heatwave thresholds
  baseline_start_year: 1991
  baseline_end_year: 2020
  # minimum heatwave length in days
  heatwave_min_days: 3

models:
  weather:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  weather:
    +schema: seeds
    cities:
      +column_types:
        latitude: double
        longitude: double
