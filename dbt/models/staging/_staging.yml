version: 2

models:
  - name: stg_open_meteo__daily_weather
    description: Cleaned daily weather, one row per city and day.
    data_tests:
      - unique_combination:
          arguments:
            columns: [city_id, weather_date]
    columns:
      - name: city_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: temp_max_c
        description: Daily maximum air temperature at 2 m (°C).
        data_tests:
          - not_null
          - value_between: {arguments: {min_value: -60, max_value: 60}}
      - name: temp_min_c
        data_tests:
          - not_null
          - value_between: {arguments: {min_value: -70, max_value: 50}}
      - name: precipitation_mm
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1000}}
      - name: sunshine_hours
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 24}}

  - name: stg_cities
    description: The cities tracked by the pipeline (from the cities seed).
    columns:
      - name: city_id
        data_tests: [unique, not_null]
      - name: latitude
        data_tests:
          - value_between: {arguments: {min_value: -90, max_value: 90}}
      - name: longitude
        data_tests:
          - value_between: {arguments: {min_value: -180, max_value: 180}}
