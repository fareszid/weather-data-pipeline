name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dashboard,dev]"
      - name: Lint
        run: |
          ruff check src tests dashboard
          ruff format --check src tests dashboard
      - name: Unit tests, dbt build on real API fixtures, dashboard smoke test (no network)
        run: pytest -v
